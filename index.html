<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>2D Frame AR Camera</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      
      <a-assets>
        <!-- 2Dフレーム画像を事前読み込み -->
        <img id="my-frame" src="PP262-022-003_4.png">
      </a-assets>

      <a-marker type="pattern" url="pattern-image (1).patt">
        <!-- 
          a-image で2Dファイルを表示
          rotation="-90 0 0" でマーカーに対して水平（寝かせた状態）に配置
          width / height で画像の比率に合わせてサイズを調整
        -->
        <a-image 
          src="#my-frame" 
          width="2" 
          height="3" 
          position="0 0 0" 
          rotation="-90 0 0">
        </a-image>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
