<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>2D Frame AR Camera</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* 1. 背景のWebcam動画表示エリア */
    #webcam {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
    }

    /* 2. 前面に固定する2Dフレーム画像 */
    #frame-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      pointer-events: none;
      z-index: 5;
    }

    /* 3. UIコントロールレイヤー */
    .ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 24px 16px;
      pointer-events: none;
    }

    .clickable {
      pointer-events: auto;
    }

    /* ヘッダー UI */
    .top-bar {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .btn-fullscreen {
      background: rgba(0, 0, 0, 0.5);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.4);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
      backdrop-filter: blur(4px);
      cursor: pointer;
    }

    .sub-hint {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.8);
      text-shadow: 0 1px 2px rgba(0,0,0,0.8);
    }

    /* フッター UI */
    .bottom-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .shutter-btn {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      border: 4px solid #fff;
      background: rgba(255, 255, 255, 0.3);
      outline: none;
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .shutter-btn:active {
      transform: scale(0.92);
      background: rgba(255, 255, 255, 0.6);
    }

    /* 4. 撮影後確認用モーダルオーバーレイ */
    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.9);
      z-index: 20;
      display: none; /* 初期状態は非表示 */
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 24px 16px;
    }

    .modal-preview {
      width: 100%;
      height: 80vh;
      object-fit: contain;
      border-radius: 8px;
    }

    .modal-actions {
      display: flex;
      gap: 16px;
      width: 100%;
      max-width: 360px;
      justify-content: center;
    }

    .btn-action {
      flex: 1;
      padding: 14px 0;
      border-radius: 30px;
      border: none;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 1px;
      cursor: pointer;
      text-transform: uppercase;
    }

    .btn-retake {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    .btn-save {
      background: #007aff;
      color: #fff;
    }

    /* 撮影合成用Canvas */
    #capture-canvas {
      display: none;
    }
  </style>
</head>
<body>

  <!-- カメラ映像 -->
  <video id="webcam" autoplay playsinline muted></video>

  <!-- 前面2Dフレーム画像 -->
  <img id="frame-overlay" src="ARフレーム1.png" alt="2D Frame">

  <!-- カメラ機能用 UI -->
  <div class="ui-layer" id="uiLayer">
    <div class="top-bar">
      <button class="btn-fullscreen clickable" id="fsBtn">ENTER FULLSCREEN</button>
      <span class="sub-hint">FOR THE BEST EXPERIENCE</span>
    </div>

    <div class="bottom-bar">
      <!-- 撮影ボタン -->
      <button class="shutter-btn clickable" id="shutterBtn"></button>
    </div>
  </div>

  <!-- 撮影後の確認モーダル -->
  <div class="modal-overlay" id="modalOverlay">
    <img id="capturedImage" class="modal-preview" alt="Captured Preview">
    
    <div class="modal-actions">
      <button class="btn-action btn-retake" id="retakeBtn">再撮影</button>
      <button class="btn-action btn-save" id="saveBtn">保存する</button>
    </div>
  </div>

  <!-- 画像合成用キャンバス -->
  <canvas id="capture-canvas"></canvas>

  <script>
    const video = document.getElementById('webcam');
    const frameOverlay = document.getElementById('frame-overlay');
    const shutterBtn = document.getElementById('shutterBtn');
    const fsBtn = document.getElementById('fsBtn');
    const uiLayer = document.getElementById('uiLayer');
    const modalOverlay = document.getElementById('modalOverlay');
    const capturedImage = document.getElementById('capturedImage');
    const retakeBtn = document.getElementById('retakeBtn');
    const saveBtn = document.getElementById('saveBtn');
    const canvas = document.getElementById('capture-canvas');
    let lastCapturedDataUrl = null;

    // 1. カメラの起動
    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' },
          audio: false
        });
        video.srcObject = stream;
      } catch (err) {
        alert('カメラの起動に失敗しました。アクセスを許可してください。');
        console.error(err);
      }
    }

    // 2. フルスクリーン切り替え
    fsBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => console.log(err));
      } else {
        document.exitFullscreen();
      }
    });

    // 3. 写真撮影とモーダル表示
    shutterBtn.addEventListener('click', () => {
      const width = window.innerWidth;
      const height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;

      const ctx = canvas.getContext('2d');

      // 背景（カメラ映像）と前面（フレーム）を合成
      ctx.drawImage(video, 0, 0, width, height);
      ctx.drawImage(frameOverlay, 0, 0, width, height);

      // 合成結果を取得して表示
      lastCapturedDataUrl = canvas.toDataURL('image/png');
      capturedImage.src = lastCapturedDataUrl;

      // モーダルを表示、カメラUIを非表示
      uiLayer.style.display = 'none';
      modalOverlay.style.display = 'flex';
    });

    // 4. 「再撮影」ボタンの動作
    retakeBtn.addEventListener('click', () => {
      modalOverlay.style.display = 'none';
      uiLayer.style.display = 'flex';
      lastCapturedDataUrl = null;
    });

    // 5. 「保存する」ボタンの動作
    saveBtn.addEventListener('click', () => {
      if (!lastCapturedDataUrl) return;

      const link = document.createElement('a');
      link.href = lastCapturedDataUrl;
      link.download = `ar_photo_${Date.now()}.png`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    });

    // ページロード時にカメラを起動
    window.addEventListener('load', initCamera);
  </script>
</body>
</html>
