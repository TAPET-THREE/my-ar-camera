<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Camera with 2D Frame Overlay</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* カメラ映像の上に重なる2Dフレーム */
    .frame-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none; /* 下のカメラ操作・ボタン操作を邪魔しない */
      z-index: 10;
      object-fit: contain; /* 画像の比率を保って画面一杯に表示 */
    }
  </style>
</head>
<body>

  <!-- 前面に固定表示する2Dフレーム画像 -->
  <img src="pp262.png" class="frame-overlay" alt="Frame Overlay">

  <!-- 背景で動くカメラ映像（AR.jsや通常のWebcam） -->
  <!-- ここに通常のカメラ表示コードやAR.jsのa-sceneを配置します -->

</body>
</html>
